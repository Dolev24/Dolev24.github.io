<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- An empty icon, so a browser does not go asking for /favicon.ico. -->
<link rel="icon" href="data:,">
<title>AquaPlay — send a playlist to your TV</title>
<!-- pair.html — the page a phone opens from the QR code on the television.

     The viewer types or pastes their playlist here, on a keyboard made for
     it, and it is sent to the set, from whatever network the phone is on:

       https://…/pair.html#r=<channel>.<key>

     The playlist is locked on this phone with AES-GCM and a key the
     television made and put in the code, then handed to a public relay
     (ntfy.sh), which only ever holds the locked form. The key is after the #,
     and a browser never sends that part of an address to anyone — not to the
     relay, and not to whoever serves this page.

     Self-contained: no script, style, font or image from anywhere — the logo
     is inside the page — so nothing this page does depends on, or is seen
     by, a third party. The same file is
     app/pair.html and docs/pair.html; test-units.js fails if they differ. -->
<style>
  :root{ color-scheme:dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:28px 20px 40px;
    font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#e9edf4; background:#0a0c10;
    background-image:radial-gradient(700px 480px at 10% -10%, rgba(76,141,255,.28), rgba(76,141,255,0) 62%);
    background-repeat:no-repeat;
  }
  main{ max-width:480px; margin:0 auto; }
  /* The wordmark, centred over a centred heading, the way the television's
     own setup screen stands. 540x180 behind a 240x80 box: sharp on a phone's
     screen, and a WebP so the page carries it for under 40 KB. */
  .logo{ display:block; width:240px; height:80px; margin:4px auto 18px; }
  h1{ font-size:26px; line-height:1.2; margin:0 0 6px; text-align:center; }
  .sub{ color:#9aa3b5; margin:0 0 22px; text-align:center; }
  #form{ margin-top:22px; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tabs button{
    flex:1; padding:11px 8px; border-radius:12px; font:inherit; font-weight:600;
    color:#c3cad6; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  }
  .tabs button[aria-selected="true"]{ color:#fff; background:#4c8dff; border-color:#4c8dff; }
  label{ display:block; margin:0 0 14px; }
  label > span{ display:block; font-size:14px; color:#9aa3b5; margin:0 0 6px; }
  label em{ font-style:normal; color:#6b7385; }
  input{
    width:100%; padding:13px 14px; border-radius:12px; font:inherit; font-size:16px;
    color:#fff; background:rgba(8,11,17,.7); border:1px solid rgba(255,255,255,.14);
  }
  /* Hebrew and Arabic: the page right to left, an address or a login as typed. */
  html[dir=rtl] input{ direction:ltr; text-align:left; }
  input:focus{ outline:none; border-color:#4c8dff; box-shadow:0 0 0 3px rgba(76,141,255,.25); }
  .file-pick input{ padding:10px 12px; font-size:15px; color:#c3cad6; }
  .file-note{ margin:-6px 0 14px; color:#6fe0a0; }
  .send{
    width:100%; margin-top:8px; padding:15px; border:0; border-radius:14px;
    font:inherit; font-size:17px; font-weight:700; color:#fff;
    background:linear-gradient(118deg, #6aa3ff 0%, #4c8dff 46%, #3a64e8 100%);
  }
  .send:disabled{ opacity:.55; }
  .send.another{ margin-top:12px; background:transparent; border:2px solid #4c8dff; color:#cfe0ff; }
  .msg{ min-height:24px; margin:16px 0 0; color:#ff8a95; }
  .msg.ok{ color:#6fe0a0; }
  .msg.wait{ color:#9aa3b5; }
  /* The TV's answer when it could not connect: what happened, what to try,
     and the details for support, for a screenshot. */
  .tv-answer{ margin:16px 0 0; padding:16px; border-radius:12px; background:#1a1f2b; border:1px solid #3a2530; }
  .tv-answer h2{ margin:0 0 8px; font-size:17px; color:#ff8a95; }
  .tv-answer p{ margin:0 0 10px; }
  .tv-answer ul{ margin:0 0 12px; padding-left:20px; }
  .tv-answer li{ margin:0 0 6px; }
  .tv-answer .det{ margin-top:10px; padding:10px 12px; border-radius:8px; background:#11151d; font-size:12px; line-height:1.5; color:#9aa3b5; word-wrap:break-word; }
  .tv-answer .det b{ display:block; margin-bottom:4px; color:#c8cfdb; }
  .tv-answer .det span{ display:block; }
  .note{ margin-top:26px; font-size:13px; color:#6b7385; }
  .plist{ margin:0 0 18px; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.06); color:#e9edf4; font-size:15px; line-height:1.5; }
  /* The next code, read here rather than in the camera app: one button, then
     the camera in the page, then the page carries on by itself. */
  .scan-btn{
    width:100%; margin-top:16px; padding:15px; border-radius:14px;
    font:inherit; font-size:17px; font-weight:700; color:#fff;
    background:linear-gradient(118deg, #6aa3ff 0%, #4c8dff 46%, #3a64e8 100%); border:0;
  }
  .scan-btn.quiet{ font-weight:600; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); }
  .scanner{ margin-top:16px; }
  .scanner video{ display:block; width:100%; max-height:62vh; object-fit:cover; border-radius:16px; background:#000; }
  .scan-hint{ margin:12px 0 0; text-align:center; color:#9aa3b5; }
  /* Where the browser cannot read a code itself (an iPhone's Safari), the
     same step said in words: the camera app is the way to the next code. */
  .scan-alt{ margin:16px 0 0; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.06); color:#c3cad6; font-size:15px; line-height:1.45; text-align:center; }
  [hidden]{ display:none !important; }
</style>

  <div id="restore" hidden>
    <p class="sub" id="r-title"></p>
    <p class="plist" id="r-list" hidden></p>
    <button type="button" class="send" id="r-send" hidden></button>
    <p class="msg" id="r-status" role="status"></p>
    <!-- A backup file saved on this phone, sent instead. -->
    <p class="note" id="r-file-note" hidden></p>
    <button type="button" class="scan-btn quiet" id="r-file-btn" hidden></button>
    <input type="file" id="r-file" accept=".json,application/json" hidden>
  </div>

  <!-- A subtitle file for what the TV is playing (js/subsmenu.js's #s=):
       read here, sent the way a playlist's file is (sendSubs, below). -->
  <div id="subs-send" hidden>
    <p class="sub" id="s-intro"></p>
    <button type="button" class="send" id="s-btn"></button>
    <input type="file" id="s-file" accept=".srt,.vtt,application/x-subrip,text/vtt" hidden>
    <p class="msg" id="s-status" role="status"></p>
    <p class="note" id="s-note"></p>
  </div>

  <!-- The camera, in the page: offered where the next step is scanning a
       television's code, on phones whose browser can read one. -->
  <button type="button" class="scan-btn" id="scan-btn" hidden></button>
  <p class="scan-alt" id="scan-alt" hidden></p>
  <div class="scanner" id="scanner" hidden>
    <video id="scan-video" playsinline muted autoplay></video>
    <p class="scan-hint" id="scan-hint" role="status"></p>
    <button type="button" class="scan-btn quiet" id="scan-cancel"></button>
  </div>
  <p class="msg" id="scan-msg" role="status" hidden></p>

  <form id="form" autocomplete="off" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-m3u" aria-selected="true">M3U</button>
      <button type="button" role="tab" id="tab-xtream" aria-selected="false">Xtream Codes</button>
      <button type="button" role="tab" id="tab-mag" aria-selected="false">MAG</button>
    </div>

    <div id="f-m3u">
      <label><span id="t-url">Playlist URL</span>
        <input type="url" id="m-url" inputmode="url" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off"></label>
      <!-- Or the playlist's file, from this phone: uploaded to the relay as a
           file of its own, locked like everything else (sendFile, below). -->
      <label class="file-pick"><span id="t-file">Or a playlist file from this phone</span>
        <input type="file" id="m-file"></label>
      <p class="note file-note" id="file-note" hidden></p>
      <label><span><span id="t-epg">Guide (EPG) URL</span> <em id="t-opt1">optional</em></span>
        <input type="url" id="m-epg" inputmode="url" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off"></label>
    </div>

    <div id="f-xtream" hidden>
      <label><span id="t-host">Server URL</span>
        <input type="url" id="x-host" inputmode="url" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off"></label>
      <label><span id="t-user">Username</span>
        <input type="text" id="x-user" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off"></label>
      <label><span id="t-pass">Password</span>
        <input type="text" id="x-pass" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off"></label>
    </div>

    <!-- A MAG portal and the MAC it knows (P4, 25 Oct 2026): the TV checks
         them with the portal, as its own MAG form does (stalker.js). -->
    <div id="f-mag" hidden>
      <label><span id="t-portal">Portal address</span>
        <input type="url" id="g-portal" inputmode="url" autocapitalize="off" spellcheck="false" autocorrect="off" autocomplete="off" placeholder="http://portal.example:8080/c/"></label>
      <label><span id="t-mac">MAC address</span>
        <input type="text" id="g-mac" dir="ltr" autocapitalize="characters" spellcheck="false" autocorrect="off" autocomplete="off" placeholder="00:1A:79:00:00:00"></label>
      <p class="note" id="mag-old" hidden></p>
    </div>

    <label><span><span id="t-name">Playlist name</span> <em id="t-opt2">optional</em></span>
      <input type="text" id="name" maxlength="80"></label>

    <button type="submit" class="send" id="send">Send to TV</button>
    <button type="button" class="send another" id="another" hidden>Add another playlist</button>
    <p class="msg" id="msg" role="status"></p>
    <div class="tv-answer" id="tv-answer" hidden></div>
    <p class="note" id="note"></p>
  </form>
</main>

    $('subs-send').hidden = false;
    $('t-title').textContent = WORDS.subsTitle;
    document.title = 'AquaPlay — ' + WORDS.subsTitle;
    if (history.replaceState) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    var stopic = subsHash[1], skey = subsHash[2];
    var sbtn = $('s-btn'), sinput = $('s-file'), sstatus = $('s-status');
    $('s-intro').textContent = WORDS.subsIntro;
    $('s-note').textContent = WORDS.subsNote;
    sbtn.textContent = WORDS.subsChoose;
    var sayS = function (text, ok) { sstatus.textContent = text || ''; sstatus.className = 'msg' + (ok ? ' ok' : ''); };
    /* The code page a file in this phone's language most likely has. */
    var OLD_PAGES = { he: 'windows-1255', ar: 'windows-1256', ru: 'windows-1251', uk: 'windows-1251', bg: 'windows-1251',
      tr: 'windows-1254', pl: 'windows-1250', cs: 'windows-1250', hu: 'windows-1250', el: 'windows-1253',
      zh: 'gb18030', ja: 'shift_jis', ko: 'euc-kr' };
    var subsText = function (bytes) {
      if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes);
      if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes);
      try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) {}
      var page = 'windows-1252';
      for (var i = 0; i < langs.length; i++) { var c = String(langs[i]).slice(0, 2).toLowerCase(); if (OLD_PAGES[c]) { page = OLD_PAGES[c]; break; } }
      try { return new TextDecoder(page).decode(bytes); } catch (e2) { return new TextDecoder('windows-1252').decode(bytes); }
    };
    var gzip = function (bytes) {
      if (typeof CompressionStream === 'undefined') return Promise.resolve(null);
      try {
        return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
          .then(function (b) { return new Uint8Array(b); }, function () { return null; });
      } catch (e) { return Promise.resolve(null); }
    };
    var sendSubs = function (text, name) {
      var subtle = window.crypto && window.crypto.subtle;
      if (!subtle) return Promise.reject(new Error(WORDS.relayFail));
      var raw = new TextEncoder().encode(text);
      return gzip(raw).then(function (gz) {
        var body = gz || raw;
        var head = new TextEncoder().encode(JSON.stringify({ v: 1, type: 'subs-file', name: String(name || '').slice(0, 120), gz: !!gz }) + '\n');
        var plain = new Uint8Array(head.length + body.length);
        plain.set(head, 0); plain.set(body, head.length);
        var iv = window.crypto.getRandomValues(new Uint8Array(12));
        return subtle.importKey('raw', unb64url(skey), { name: 'AES-GCM' }, false, ['encrypt']).then(function (key) {
          return subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: new TextEncoder().encode('aquaplay3') }, key, plain);
        }).then(function (ct) {
          var out = new Uint8Array(12 + ct.byteLength);
          out.set(iv, 0); out.set(new Uint8Array(ct), 12);
          return fetch(RELAY + stopic, { method: 'PUT', body: out, cache: 'no-store', referrerPolicy: 'no-referrer',
            headers: { 'Filename': 'aquaplay.bin', 'Message': 'aquaplay3' } }).then(function (r) {
              if (!r.ok) throw new Error(WORDS.relayFail + ' (PHONE-RELAY-' + r.status + ')');
            }, function () { throw new Error(WORDS.relayFail + ' (PHONE-NO-CONNECTION)'); });
        });
      });
    };
    sbtn.onclick = function () { sinput.value = ''; sinput.click(); };
    sinput.onchange = function () {
      var f = sinput.files && sinput.files[0];
      if (!f) return;
      if (f.size > 4 * 1024 * 1024) { sayS(WORDS.subsBig); return; }
      sbtn.disabled = true; sayS(WORDS.sending, true);
      var read = f.arrayBuffer ? f.arrayBuffer() : new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(f); });
      read.then(function (buf) {
        var text = subsText(new Uint8Array(buf));
        if (!/\d\d:\d\d[:.,\d]*\s*-->/.test(text)) throw new Error(WORDS.subsNot);
        return sendSubs(text, f.name);
      }).then(function () {
        sayS(WORDS.sent, true);
        sbtn.hidden = true;
      }, function (err) {
        sayS((err && err.message) || WORDS.relayFail);
        sbtn.disabled = false;
      });
    };
    return;
  }

  /* ---- which way this page was opened ---- */
  var relay = /[#&]r=([A-Za-z0-9_-]{16,64})\.([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  if (!relay) { $('dead').hidden = false; offerScan('scanTv'); return; }
  /* A TV that keeps listening after the first playlist says so (&m=1):
     then, and only then, another can follow from here. An older TV would
     never answer a second one. */
  var more = /[#&]m=1(?:&|$)/.test(location.hash);
  /* The MAG tab always (26 Oct 2026: a code opened without its flags hid
     it). A TV that has not said it opens MAG portals (&g=1, 1.0.51) may be
     an older one: the tab says what it needs, and sends all the same. */
  if (!/[#&]g=1(?:&|$)/.test(location.hash)) { $('mag-old').textContent = WORDS.magOld; $('mag-old').hidden = false; }
  put('another', 'another');
  $('form').hidden = false;
  put('note', 'noteRelay');
  /* The key has done its job once it is in memory; the address bar and the
     history do not need to keep it. */
  if (history.replaceState) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

  var type = 'm3u';
  function setType(t) {
    type = t;
    $('tab-m3u').setAttribute('aria-selected', String(t === 'm3u'));
    $('tab-xtream').setAttribute('aria-selected', String(t === 'xtream'));
    $('tab-mag').setAttribute('aria-selected', String(t === 'mag'));
    $('f-mag').hidden = t !== 'mag';
    $('f-m3u').hidden = t !== 'm3u';
    $('f-xtream').hidden = t !== 'xtream';
    msg('');
  }
  $('tab-m3u').onclick = function () { setType('m3u'); };
  $('tab-xtream').onclick = function () { setType('xtream'); };
  $('tab-mag').onclick = function () { setType('mag'); };

  function msg(text, ok) { $('msg').textContent = text || ''; $('msg').className = 'msg' + (ok ? ' ok' : ''); }
  /* Trimmed, and without the characters nobody can see (cleanPaste). */
  function val(id) { return $(id).value.replace(INVISIBLE, '').replace(/^\s+|\s+$/g, ''); }

  /* What is pasted is cleaned before it lands (the owner, 1.0.50: a paste
     "with extra lettering that wasn't meant to be pasted"). A provider's
     details usually arrive as a message — "Username: anna", a chat app's
     "[21/10, 11:20] Anna: http://…", an address in quotes or with a full stop
     after it, characters nobody can see. So, into any box:
     - the invisible ones go (zero-width, direction marks, the BOM), and a
       no-break space is a space;
     - a chat app's "[date, time] Name:" before each line goes;
     - into an address box, the address out of whatever surrounds it;
     - into a login box, the value after its label ("Password: …");
     - several labelled lines (or an Xtream address with username= and
       password= in it) pasted into an Xtream box fill all three boxes.
     A paste that needs none of this is left to the browser. */
  var INVISIBLE = /[​-‏‪-‮⁠-⁤﻿­]/g;
  var CHAT_PREFIX = /^\s*\[[^\]\n]{3,40}\]\s*[^:\n]{1,40}:\s*/;
  var LABELS = {
    host: /^(?:url|host|server|portal|dns|address|m3u(?:\s*(?:url|link))?|link|xtream(?:\s*(?:url|host))?)\s*[:=]\s*/i,
    user: /^(?:user\s*name|username|user|login|user\s*id)\s*[:=]\s*/i,
    pass: /^(?:pass\s*word|password|pass|pwd|pw)\s*[:=]\s*/i
  };
  function lines(text) {
    return String(text).replace(INVISIBLE, '').replace(/ /g, ' ').split(/\r\n|\r|\n/)
      .map(function (l) { return l.replace(CHAT_PREFIX, '').replace(/^\s+|\s+$/g, ''); })
      .filter(function (l) { return l; });
  }
  /* Only a matching pair comes off: a password may end in a quote mark. */
  var PAIRS = { '"': '"', "'": "'", '`': '`', '<': '>', '«': '»', '“': '”', '‘': '’' };
  function unquote(s) {
    var a = s.charAt(0), z = s.charAt(s.length - 1);
    return s.length > 1 && PAIRS[a] === z ? s.slice(1, -1) : s;
  }
  function firstUrl(text) {
    var m = /https?:\/\/[^\s"'<>`]+/i.exec(text);
    return m ? m[0].replace(/[.,;:!?)\]}»”’'"]+$/, '') : '';
  }
  function labelled(list) {
    var out = {};
    list.forEach(function (l) {
      for (var k in LABELS) {
        if (LABELS[k].test(l) && !out[k]) out[k] = unquote(l.replace(LABELS[k], '').replace(/^\s+|\s+$/g, ''));
      }
    });
    return out;
  }
  function xtreamFromUrl(url) {
    var m = /^(https?:\/\/[^\/?#\s]+)[^?#\s]*\?(.*)$/i.exec(url);
    if (!m) return null;
    var q = {};
    m[2].split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) { try { q[kv.slice(0, i).toLowerCase()] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
    });
    return q.username && q.password ? { host: m[1], user: q.username, pass: q.password } : null;
  }
  function cleanPaste(id, raw) {
    var list = lines(raw), all = list.join('\n');
    if (!list.length) return { value: '' };
    var xtreamBox = id === 'x-host' || id === 'x-user' || id === 'x-pass';
    if (xtreamBox) {
      var found = labelled(list), url = firstUrl(all);
      var fromUrl = url ? xtreamFromUrl(url) : null;
      if (fromUrl) return { fill: fromUrl };
      if (!found.host && url && (found.user || found.pass)) found.host = url;
      var n = (found.host ? 1 : 0) + (found.user ? 1 : 0) + (found.pass ? 1 : 0);
      if (n >= 2) return { fill: found };
    }
    if (id === 'm-url' || id === 'm-epg' || id === 'x-host') {
      var u = firstUrl(all);
      if (u) return { value: u };
      var h = labelled(list).host;
      return { value: unquote(h || list[0]) };
    }
    if (id === 'g-portal') {
      var pu = firstUrl(all);
      return { value: pu || unquote(labelled(list).host || list[0]) };
    }
    if (id === 'g-mac') {
      var mm = /([0-9a-f]{2}[:\-]){5}[0-9a-f]{2}/i.exec(all);
      return { value: mm ? mm[0].replace(/-/g, ':').toUpperCase() : unquote(list[0]) };
    }
    if (id === 'x-user' || id === 'x-pass') {
      var key = id === 'x-user' ? 'user' : 'pass', l = labelled(list);
      if (l[key]) return { value: l[key] };
      return { value: unquote(list[0]) };
    }
    return { value: list.join(' ') };
  }
  ['m-url', 'm-epg', 'x-host', 'x-user', 'x-pass', 'g-portal', 'g-mac', 'name'].forEach(function (id) {
    var box = $(id);
    box.addEventListener('paste', function (ev) {
      var data = ev.clipboardData || window.clipboardData;
      var raw = '';
      try { raw = (data && data.getData) ? (data.getData('text/plain') || data.getData('text')) : ''; } catch (e) {}
      if (!raw) return;
      var out = cleanPaste(id, raw);
      if (!out.fill && out.value === raw) return;
      /* The browser pastes as it always does, and what it put in is tidied
         just after (26 Oct 2026: on an iPhone, Safari pasted as well as the
         page, so text that was never copied showed up). What was in the box
         around the paste is kept as it was. */
      var before = box.value, a = null, b = null;
      try { a = box.selectionStart; b = box.selectionEnd; } catch (e) {}
      setTimeout(function () {
        if (out.fill) {
          box.value = before;
          if (out.fill.host) $('x-host').value = out.fill.host;
          if (out.fill.user) $('x-user').value = out.fill.user;
          if (out.fill.pass) $('x-pass').value = out.fill.pass;
          if (id === 'x-host' || id === 'x-user' || id === 'x-pass') return;
        }
        var v = out.fill ? '' : out.value;
        if (typeof a === 'number' && typeof b === 'number' && before) {
          box.value = before.slice(0, a) + v + before.slice(b);
          try { box.setSelectionRange(a + v.length, a + v.length); } catch (e) {}
        } else box.value = v;
      }, 0);
    }, false);
  });


  function payload() {
    var name = val('name');
    if (type === 'm3u') {
      var url = val('m-url');
      /* A file chosen, and no address typed: the file. */
      var file = $('m-file').files && $('m-file').files[0];
      if (!url && file) return { file: file, name: name };
      if (!url) return { error: WORDS.needUrl };
      if (!/^https?:\/\//i.test(url)) return { error: WORDS.badUrl };
      return { v: 1, type: 'm3u', name: name, url: url, epg: val('m-epg') };
    }
    if (type === 'mag') {
      var portal = val('g-portal'), hex = val('g-mac').replace(/[^0-9a-fA-F]/g, '').toUpperCase();
      if (!portal || hex.length !== 12) return { error: WORDS.needMag };
      if (!/^https?:\/\//i.test(portal)) portal = 'http://' + portal;
      return { v: 1, type: 'stalker', name: name, portal: portal, mac: hex.match(/../g).join(':') };
    }
    var host = val('x-host'), user = val('x-user'), pass = val('x-pass');
    if (!host || !user || !pass) return { error: WORDS.needXt };
    if (!/^https?:\/\//i.test(host)) host = 'http://' + host;
    return { v: 1, type: 'xtream', name: name, host: host, user: user, pass: pass };
  }

  /* b64url, unb64url and lock are defined once, above, and used by every flow
     on this page (the label defaults to 'aquaplay1', which is all this one
     ever needed). */
  /* A failure to send says which, with a code to quote: the relay answered
     no, or could not be reached at all. */
  function send(obj) {
    return lock(obj, relay[2]).then(function (body) {
      return fetch(RELAY + relay[1], { method: 'POST', body: body, cache: 'no-store', referrerPolicy: 'no-referrer' });
    }).then(function (r) {
      if (!r.ok) throw new Error(WORDS.relayFail + ' (PHONE-RELAY-' + r.status + ')');
    }, function () { throw new Error(WORDS.relayFail + ' (PHONE-NO-CONNECTION)'); });
  }

  /* A playlist's file, which is too big for a relay message (4096 bytes):
     packed where this browser can (CompressionStream), locked with the same
     key under a word of its own, and put on the relay as a file — ntfy.sh
     keeps one up to 15 MB for three hours — with a message saying that word,
     which the TV (js/pair.js, unlockFile) fetches and unlocks. The file is
     the iv and then the ciphertext; inside, a line of JSON, a newline, and
     the playlist's bytes. */
  var FILE_LABEL = 'aquaplay3', FILE_MAX = 15 * 1024 * 1024;
  function pack(bytes) {
    if (typeof CompressionStream === 'undefined') return Promise.resolve(null);
    try {
      return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
        .then(function (b) { return new Uint8Array(b); }, function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function readFile(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(file); });
  }
  function countChannels(bytes) {
    var text = new TextDecoder().decode(bytes.subarray(0, Math.min(bytes.length, 64 * 1024 * 1024)));
    return (text.match(/#EXTINF/g) || []).length;
  }
  function sendFile(p) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return Promise.reject(new Error(WORDS.relayFail));
    return readFile(p.file).then(function (buf) {
      var raw = new Uint8Array(buf);
      if (!countChannels(raw)) throw new Error(WORDS.plFileNot);
      return pack(raw).then(function (gz) {
        var body = gz || raw;
        var head = new TextEncoder().encode(JSON.stringify({ v: 1, type: 'm3u-file', name: p.name || p.file.name || 'playlist.m3u', gz: !!gz }) + '\n');
        var plain = new Uint8Array(head.length + body.length);
        plain.set(head, 0); plain.set(body, head.length);
        var iv = window.crypto.getRandomValues(new Uint8Array(12));
        return subtle.importKey('raw', unb64url(relay[2]), { name: 'AES-GCM' }, false, ['encrypt']).then(function (key) {
          return subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: new TextEncoder().encode(FILE_LABEL) }, key, plain);
        }).then(function (ct) {
          var out = new Uint8Array(12 + ct.byteLength);
          out.set(iv, 0); out.set(new Uint8Array(ct), 12);
          if (out.length > FILE_MAX) throw new Error(WORDS.plFileBig);
          return fetch(RELAY + relay[1], { method: 'PUT', body: out, cache: 'no-store', referrerPolicy: 'no-referrer',
            headers: { 'Filename': 'aquaplay.bin', 'Message': FILE_LABEL } }).then(function (r) {
              if (!r.ok) throw new Error(WORDS.relayFail + ' (PHONE-RELAY-' + r.status + ')');
            }, function () { throw new Error(WORDS.relayFail + ' (PHONE-NO-CONNECTION)'); });
        });
      });
    });
  }
  /* What was chosen, said under the box: its name and how many channels. */
  $('m-file').onchange = function () {
    var f = this.files && this.files[0], note = $('file-note');
    if (!f) { note.hidden = true; return; }
    readFile(f).then(function (buf) {
      var n = countChannels(new Uint8Array(buf));
      note.textContent = n ? WORDS.plFileGot.replace('{name}', f.name).replace('{n}', n) : WORDS.plFileNot;
      note.style.color = n ? '' : '#ff8a95';
      note.hidden = false;
    }, function () { note.hidden = true; });
  };

  /* How it went, from the TV (js/views/setup.js, js/pair.js): it answers on
     the same address, locked with the same key under a word of its own,
     once it has tried to connect. Asked every three seconds for two minutes;
     a TV with an older AquaPlay never answers, and "Sent" stays. */
  var REPLY_LABEL = 'aquaplay-reply';
  function answer(o) {
    var box = $('tv-answer');
    while (box.firstChild) box.removeChild(box.firstChild);
    if (o.ok) {
      box.hidden = true; msg(WORDS.tvOk.replace('{name}', o.name || ''), true);
      if (more) $('another').hidden = false;
      return;
    }
    msg('');
    var add = function (tag, text, host) { var e = document.createElement(tag); if (text != null) e.textContent = text; (host || box).appendChild(e); return e; };
    add('h2', o.title || WORDS.tvFail);
    if (o.what) add('p', o.what);
    if (o.tries && o.tries.length) { var ul = add('ul'); o.tries.forEach(function (t) { add('li', t, ul); }); }
    add('p', WORDS.again);
    if (o.details && o.details.length) {
      var det = add('div'); det.className = 'det';
      add('b', WORDS.helpShot, det);
      o.details.forEach(function (l) { add('span', l, det); });
    }
    box.hidden = false;
    $('send').disabled = false;
  }
  /* Every answer already shown, across sends: the next playlist's listening
     starts a few seconds back and would hear the last one's answer again. */
  var heard = {};
  function listenForTv(since) {
    var seen = heard, tries = 0, done = false;
    var look = function () {
      if (done) return;
      if (++tries > 40) { msg(WORDS.sent, true); return; }
      fetch(RELAY + relay[1] + '/json?poll=1&since=' + since, { cache: 'no-store', referrerPolicy: 'no-referrer' }).then(function (r) {
        return r.ok ? r.text() : '';
      }).then(function (text) {
        String(text || '').split('\n').forEach(function (line) {
          var ev = null;
          try { ev = JSON.parse(line); } catch (e) { return; }
          if (!ev || ev.event !== 'message' || !ev.id || seen[ev.id]) return;
          seen[ev.id] = 1;
          unlock(ev.message, relay[2], REPLY_LABEL).then(function (o) {
            if (done || !o || typeof o !== 'object') return;
            done = true;
            answer(o);
          }, function () { /* the playlist this page sent, or not ours */ });
        });
      }, function () {}).then(function () { if (!done) setTimeout(look, 3000); });
    };
    setTimeout(look, 2000);
  }

  $('another').onclick = function () {
    ['name', 'm-url', 'm-epg', 'x-host', 'x-user', 'x-pass'].forEach(function (id) { $(id).value = ''; });
    $('m-file').value = ''; $('file-note').hidden = true;
    $('another').hidden = true; $('tv-answer').hidden = true;
    $('send').disabled = false; put('send', 'send'); msg('');
    window.scrollTo(0, 0);
  };

  $('form').onsubmit = function (ev) {
    ev.preventDefault();
    var p = payload();
    if (p.error) { msg(p.error); return false; }
    $('send').disabled = true;
    put('send', 'sending');
    msg('');
    $('tv-answer').hidden = true;
    var since = Math.floor(Date.now() / 1000) - 5;
    (p.file ? sendFile(p) : send(p)).then(function () {
      msg(WORDS.waitTv, true);
      put('send', 'send');
      listenForTv(since);
    }, function (err) {
      msg(err && err.message ? err.message : WORDS.relayFail);
      $('send').disabled = false;
      put('send', 'send');
    });
    return false;
  };
})();
</script>
</body>
