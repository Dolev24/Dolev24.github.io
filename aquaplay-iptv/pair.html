<title>AquaPlay — send a playlist to your TV</title>
<!-- pair.html — the page a phone opens from the QR code on the television.

     The viewer types or pastes their playlist here, on a keyboard made for
     it, and it is sent to the set, from whatever network the phone is on:

       https://…/pair.html#r=<channel>.<key>

     The playlist is locked on this phone with AES-GCM and a key the
     television made and put in the code, then handed to a public relay
     (ntfy.sh), which only ever holds the locked form. The key is after the #,
     and a browser never sends that part of an address to anyone — not to the
     relay, and not to whoever serves this page.

     Self-contained: no script, style, font or image from anywhere — the logo
     is inside the page — so nothing this page does depends on, or is seen
     by, a third party. The same file is
     app/pair.html and docs/pair.html; test-units.js fails if they differ. -->
<style>
  :root{ color-scheme:dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:28px 20px 40px;
    font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#e9edf4; background:#0a0c10;
    background-image:radial-gradient(700px 480px at 10% -10%, rgba(76,141,255,.28), rgba(76,141,255,0) 62%);
    background-repeat:no-repeat;
  }
  main{ max-width:480px; margin:0 auto; }
  /* The wordmark, centred over a centred heading, the way the television's
     own setup screen stands. 540x180 behind a 240x80 box: sharp on a phone's
     screen, and a WebP so the page carries it for under 40 KB. */
  .logo{ display:block; width:240px; height:80px; margin:4px auto 18px; }
  h1{ font-size:26px; line-height:1.2; margin:0 0 6px; text-align:center; }
  .sub{ color:#9aa3b5; margin:0 0 22px; text-align:center; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tabs button{
    flex:1; padding:11px 8px; border-radius:12px; font:inherit; font-weight:600;
    color:#c3cad6; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  }
  .tabs button[aria-selected="true"]{ color:#fff; background:#4c8dff; border-color:#4c8dff; }
  label{ display:block; margin:0 0 14px; }
  label > span{ display:block; font-size:14px; color:#9aa3b5; margin:0 0 6px; }
  label em{ font-style:normal; color:#6b7385; }
  input{
    width:100%; padding:13px 14px; border-radius:12px; font:inherit; font-size:16px;
    color:#fff; background:rgba(8,11,17,.7); border:1px solid rgba(255,255,255,.14);
  }
  input:focus{ outline:none; border-color:#4c8dff; box-shadow:0 0 0 3px rgba(76,141,255,.25); }
  .send{
    width:100%; margin-top:8px; padding:15px; border:0; border-radius:14px;
    font:inherit; font-size:17px; font-weight:700; color:#fff;
    background:linear-gradient(118deg, #6aa3ff 0%, #4c8dff 46%, #3a64e8 100%);
  }
  .send:disabled{ opacity:.55; }
  .msg{ min-height:24px; margin:16px 0 0; color:#ff8a95; }
  .msg.ok{ color:#6fe0a0; }
  .msg.wait{ color:#9aa3b5; }
  .note{ margin-top:26px; font-size:13px; color:#6b7385; }
  .plist{ margin:0 0 18px; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.06); color:#e9edf4; font-size:15px; line-height:1.5; }
  [hidden]{ display:none !important; }
</style>

  /* ---- crypto, both ways ----

     to a television) and unlock (new here: a television's own backup,
     coming the other way). Same shape as js/pair.js's P.lock / P.unlock —

    }).then(function (plain) {
      return JSON.parse(new TextDecoder().decode(plain));
    });

     Not a live listen like the other two flows: the television posted this
     once, before it ever showed the code, so it is either already sitting on
     the relay or it never will be — a few tries, a few seconds apart, catch
     it arriving a moment late and nothing more. */
  var backupHash = /[#&]b=([A-Za-z0-9_-]{16,64})\.([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  if (backupHash) {
    $('backup').hidden = false;
    $('t-title').textContent = WORDS.backupTitle; $('t-sub').hidden = true;
    document.title = 'AquaPlay — ' + WORDS.backupTitle;
    if (history.replaceState) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    var btopic = backupHash[1], bkey = backupHash[2];
    var bstatus = $('b-status');
    var setB = function (text, cls) { bstatus.textContent = text; bstatus.className = 'msg' + (cls ? ' ' + cls : ''); };
    (function fetchBackup(tries) {
      setB(WORDS.backupWaiting, 'wait');
      fetch(RELAY + btopic + '/json?poll=1&since=all', { cache: 'no-store', referrerPolicy: 'no-referrer' }).then(function (r) {
        return r.text();
      }).then(function (text) {
        var lines = text.split('\n'), found = null, i;
        for (i = 0; i < lines.length; i++) {
          if (!lines[i]) continue;
          var ev = null; try { ev = JSON.parse(lines[i]); } catch (e) {}
          if (ev && ev.event === 'message' && ev.message) found = ev.message;
        }
        if (!found) {
          if (tries < 5) { setTimeout(function () { fetchBackup(tries + 1); }, 1500); return; }
          setB(WORDS.backupNotFound);
          return;
        }
        unlock(found, bkey, 'aquaplay2').then(function (obj) {
          holdBackup(obj);
          $('b-note').hidden = false; $('b-note').textContent = WORDS.backupNote;
          setB(WORDS.backupGot, 'ok');
        }, function () {
          if (tries < 2) { setTimeout(function () { fetchBackup(tries + 1); }, 1000); return; }
          setB(WORDS.backupNotFound);
        });
      }, function () {
        if (tries < 5) { setTimeout(function () { fetchBackup(tries + 1); }, 1500); return; }
        setB(WORDS.relayFail);
      });
    })(0);
    return;
  }

  /* ---- sending what was picked up on to a second television (#x=) ----
     The television is listening live, the same way it would for a playlist
     typed here; this page's only job is to hand back what #b= left in
     localStorage, encrypted for this new code instead of the old one. */
  var restoreHash = /[#&]x=([A-Za-z0-9_-]{16,64})\.([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  if (restoreHash) {
    $('restore').hidden = false;
    $('t-title').textContent = WORDS.sendTitle; $('t-sub').hidden = true;
    document.title = 'AquaPlay — ' + WORDS.sendTitle;
    if (history.replaceState) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    var xtopic = restoreHash[1], xkey = restoreHash[2];
    var held = heldBackup();
    var rstatus = $('r-status');
    if (!held) { rstatus.textContent = WORDS.sendNothing; return; }
    $('r-title').textContent = WORDS.sendConfirm;
    var names = (held.backup.profiles || []).map(function (p) { return p.name; }).filter(Boolean).join(', ');
    if (names) { $('r-list').hidden = false; $('r-list').textContent = names; }
    var rbtn = $('r-send');
    rbtn.hidden = false; rbtn.textContent = WORDS.sendBtn;
    rbtn.onclick = function () {
      rbtn.disabled = true; rbtn.textContent = WORDS.sending;
      rstatus.textContent = ''; rstatus.className = 'msg';
      lock(held.backup, xkey, 'aquaplay2').then(function (body) {
        return fetch(RELAY + xtopic, { method: 'POST', body: body, cache: 'no-store', referrerPolicy: 'no-referrer' });
      }).then(function (r) {
        if (!r.ok) throw new Error(WORDS.relayFail);
        rstatus.textContent = WORDS.sent; rstatus.className = 'msg ok';
        rbtn.hidden = true;
      }, function (err) {
        rstatus.textContent = (err && err.message) || WORDS.relayFail; rstatus.className = 'msg';
        rbtn.disabled = false; rbtn.textContent = WORDS.sendBtn;
      });
    };
    return;
  }

  /* ---- which way this page was opened ---- */
  var relay = /[#&]r=([A-Za-z0-9_-]{16,64})\.([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
  if (!relay) { $('dead').hidden = false; $('t-sub').hidden = true; return; }
  $('form').hidden = false;
  put('note', 'noteRelay');
  /* The key has done its job once it is in memory; the address bar and the
     history do not need to keep it. */
  if (history.replaceState) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

  var type = 'm3u';
  function setType(t) {
    type = t;
    $('tab-m3u').setAttribute('aria-selected', String(t === 'm3u'));
    $('tab-xtream').setAttribute('aria-selected', String(t === 'xtream'));
    $('f-m3u').hidden = t !== 'm3u';
    $('f-xtream').hidden = t !== 'xtream';
    msg('');
  }
  $('tab-m3u').onclick = function () { setType('m3u'); };
  $('tab-xtream').onclick = function () { setType('xtream'); };

  function msg(text, ok) { $('msg').textContent = text || ''; $('msg').className = 'msg' + (ok ? ' ok' : ''); }
  function val(id) { return $(id).value.replace(/^\s+|\s+$/g, ''); }

  function payload() {
    var name = val('name');
    if (type === 'm3u') {
      var url = val('m-url');
      if (!url) return { error: WORDS.needUrl };
      if (!/^https?:\/\//i.test(url)) return { error: WORDS.badUrl };
      return { v: 1, type: 'm3u', name: name, url: url, epg: val('m-epg') };
    }
    var host = val('x-host'), user = val('x-user'), pass = val('x-pass');
    if (!host || !user || !pass) return { error: WORDS.needXt };
    if (!/^https?:\/\//i.test(host)) host = 'http://' + host;
    return { v: 1, type: 'xtream', name: name, host: host, user: user, pass: pass };
  }

  /* b64url, unb64url and lock are defined once, above, and used by every flow
     on this page (the label defaults to 'aquaplay1', which is all this one
     ever needed). */
  function send(obj) {
    return lock(obj, relay[2]).then(function (body) {
      return fetch(RELAY + relay[1], { method: 'POST', body: body, cache: 'no-store', referrerPolicy: 'no-referrer' });
    }).then(function (r) {
      if (!r.ok) throw new Error(WORDS.relayFail);
    }, function () { throw new Error(WORDS.relayFail); });
  }

  $('form').onsubmit = function (ev) {
    ev.preventDefault();
    var p = payload();
    if (p.error) { msg(p.error); return false; }
    $('send').disabled = true;
    put('send', 'sending');
    msg('');
    send(p).then(function () {
      msg(WORDS.sent, true);
      put('send', 'send');
    }, function (err) {
      msg(err && err.message ? err.message : WORDS.relayFail);
      $('send').disabled = false;
      put('send', 'send');
    });
    return false;
  };
})();
</script>
</body>
</html>
