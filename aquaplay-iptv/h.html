<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AquaPlay settings</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; padding:24px 16px 40px; background:#0b0f16; color:#e8edf5;
        font:16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main{ max-width:560px; margin:0 auto; }
  h1{ font-size:24px; margin:0 0 6px; }
  .note{ color:#9aa6b8; font-size:14px; margin:0 0 20px; }
  table{ width:100%; border-collapse:collapse; margin:0 0 22px; }
  th, td{ text-align:left; vertical-align:top; padding:9px 0; border-bottom:1px solid #1d2533; }
  th{ width:42%; color:#9aa6b8; font-weight:500; padding-right:12px; }
  td{ word-break:break-word; }
  h2{ font-size:17px; margin:8px 0 6px; }
  .bad{ color:#ff8a95; }
  ul{ margin:0 0 22px; padding-left:20px; }
  details.support{ margin:26px 0 0; padding:12px 14px; border:1px solid #1d2533; border-radius:10px; color:#9aa3b5; }
  details.support summary{ cursor:pointer; font-weight:700; color:#cfe0ff; }
  details.support h3{ font-size:15px; margin:14px 0 6px; color:#e7eef5; }
  li{ margin:6px 0; color:#ffd37a; }
  button{ width:100%; margin-top:10px; padding:14px; border:0; border-radius:12px; font:inherit; font-weight:700;
          color:#fff; background:linear-gradient(118deg, #6aa3ff 0%, #4c8dff 46%, #3a64e8 100%); }
  button.alt{ background:transparent; border:2px solid #4c8dff; color:#cfe0ff; }
  .msg{ min-height:22px; margin-top:12px; color:#6fe0a0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>AquaPlay settings</h1>
  <p class="note" id="note">Shared from an AquaPlay TV (Settings, Help, Share my settings). Everything here is in this page's
    own link: nothing was sent to a server, and it holds no playlist address, username, password or PIN.</p>
  <div id="out"></div>
  <button type="button" id="copy" hidden>Copy as text</button>
  <button type="button" class="alt" id="share" hidden>Share</button>
  <p class="msg" id="msg" role="status"></p>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LANGS = { en: 'English', es: 'Spanish', fr: 'French', de: 'German', pt: 'Portuguese', it: 'Italian', pl: 'Polish',
                ru: 'Russian', hi: 'Hindi', ja: 'Japanese', ko: 'Korean', he: 'Hebrew', ar: 'Arabic', zh: 'Chinese', tr: 'Turkish', fi: 'Finnish' };
  var PREMIUM = { off: 'Everything included (no Premium on this TV)', owned: 'Premium', trial: 'Free trial',
                  ended: 'Trial ended (free)', free: 'Free', store: 'Free (installed outside Google Play)', pc: 'Everything included (PC)' };
  /* From 1.0.52 the link is shorter: #z=, the LZ below (the app's
     settings.js has the other half); before, #d=, base64. */
  var KEY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$';
  function lzDecompress(s) {
    var rev = {}, i;
    for (i = 0; i < KEY.length; i++) rev[KEY.charAt(i)] = i;
    if (!s) return null;
    var dict = [0, 1, 2], enlarge = 4, size = 4, nb = 3, w, c, entry, out = [];
    var dval = rev[s.charAt(0)], dpos = 32, didx = 1;
    function read(n) {
      var b = 0, p = 1, m = Math.pow(2, n);
      while (p !== m) {
        var r = dval & dpos; dpos >>= 1;
        if (dpos === 0) { dpos = 32; dval = rev[s.charAt(didx++)]; }
        b |= (r > 0 ? 1 : 0) * p; p <<= 1;
      }
      return b;
    }
    switch (read(2)) { case 0: c = String.fromCharCode(read(8)); break; case 1: c = String.fromCharCode(read(16)); break; default: return ''; }
    dict[3] = c; w = c; out.push(c);
    for (;;) {
      if (didx > s.length) return null;
      var cc = read(nb);
      if (cc === 0 || cc === 1) { dict[size++] = String.fromCharCode(read(cc ? 16 : 8)); cc = size - 1; if (--enlarge === 0) { enlarge = Math.pow(2, nb); nb++; } }
      else if (cc === 2) return out.join('');
      if (dict[cc]) entry = dict[cc]; else if (cc === size) entry = w + w.charAt(0); else return null;
      out.push(entry);
      dict[size++] = w + entry.charAt(0);
      w = entry;
      if (--enlarge === 0) { enlarge = Math.pow(2, nb); nb++; }
    }
  }
  /* The settings by number (frozen at 1.0.52: a new one goes on the end; one
     not here is sent by name), x's fields by letter, and the words as codes.
     the app (settings.js) has the same tables: keep them in step. */
  var HELP_KEYS = ["epg","progDesc","descSize","descScroll","descTwoLines","guideRows","listNumbers","besideRight","scheduleKey","scheduleRev","okTwice","colourOld","colourRev","posterSize","posters","upNext","upNextCount","posterQuality","vodTogether","skipIntros","skipIntrosRev","subsAuto","subsMode","subLang","epgHours","epgHoursRev","catchupHours","catchupRev","hideEmptyGroups","startupPlayLast","startupFullscreen","sortBy","groupSort","dateFormat","guideView","pictureSize","maxQuality","subSize","subColor","subBack","subPos","subOpacity","subBold","epgOffset","clock24","fsClock","guideSize","guideCustom","fsClockPos","autoReconnect","freezeReload","hlsEngine","theme","customTheme","textSize","lang","arrowZap","lrPages","backToFull","audioBoost","upArrow","altRows","showLogos","startGroup","groupsRail","keys","dpadMenuRev","dpad","dpadRev","parental","pin","streamFormat","bufferSize","filmPlayer","playerEngine","osdSeconds","osdNumber","progPics","homeScreen","layout","homeLast","homeSplit","driftWarn","driftWarnRev","updateCheck","screensaver","mvLayout","mvShape2","mvShape3","volPos"];
  var HELP_X = { ext: 'e', fmt: 't', tsOk: 'K', tsAsk: 'a', exp: 'x', cons: 'o', mbit: 'm', free: 'f', heap: 'h', up: 'u', errs: 'r', gcov: 'c', logos: 'l', guides: 'g', tz: 'z', net: 'n', link: 'k', vod: 'v', viewers: 'w', simkl: 's', ts: 'p', low: 'L', apps: 'A', hist: 'H' };
  /* The steps of starting (crash.js, Crash.step), by number in a link. Only
     ever added to at the end. */
  var HELP_STEPS = ['reading the saved playlist', 'reading the playlist', 'playlist ready', 'reading the saved guide', 'guide ready', 'downloading the guide', 'guide read', 'first play'];
  var HELP_PL = { 'M3U address': 'a', 'M3U file': 'f', 'Xtream Codes': 'x', 'MAG portal': 's' };
  var HELP_ENG = { avplay: 't', exoplayer: 'e', 'hls.js': 'h', video: 'v' };
  /* #y= (1.0.52): an array in a fixed order (settings.js, helpShort), made
     back into what a #d= or #z= link holds. */
  function expand(a) {
    if (!Array.isArray(a)) return null;
    var back = function (o) { var r = {}; for (var k in o) r[o[k]] = k; return r; };
    var X = back(HELP_X), PL = back(HELP_PL), ENG = back(HELP_ENG), s = {}, x = {};
    var sl = Array.isArray(a[9]) ? a[9] : [];
    for (var si = 0; si + 1 < sl.length; si += 2) s[typeof sl[si] === 'number' ? (HELP_KEYS[sl[si]] || '#' + sl[si]) : sl[si]] = sl[si + 1];
    for (var k in a[13] || {}) x[X[k] || k] = a[13][k];
    var dev = a[1];
    if (Array.isArray(dev)) dev = 'Samsung ' + dev[0] + (dev[1] ? ' (' + dev[1] + ')' : '') + ', Tizen ' + dev[2] + (dev[3] ? ', firmware ' + dev[3] : '') + (dev[4] ? ', ' + dev[4] + ' MB of memory' : '');
    var stalls = [], f = Array.isArray(a[12]) ? a[12] : [];
    for (var i = 0; i < f.length; i += 2) {
      var t = [f[i], f[i + 1]];
      if (typeof f[i + 2] === 'string') { t.push(f[i + 2]); i++; }
      stalls.push(t);
    }
    var d = { v: a[0], dev: String(dev || ''), lang: a[2], pl: PL[a[3]] || a[3] || '', pls: a[4], ch: a[5], guide: a[6], pm: a[7],
      at: (a[8] || 0) * 1000, s: s, chn: a[10] || '', x: x, stalls: stalls };
    if (a[14]) d.err = a[14];
    if (a[11]) {
      d.play = { kind: a[11][0], eng: ENG[a[11][1]] || a[11][1] };
      if (a[11][4]) d.play.size = a[11][4];
      d.play.tracks = a[11][2] || '';
      d.play.muted = a[11][3] || 0;
    }
    return d;
  }
  var m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash), mz = /[#&]z=([A-Za-z0-9+$-]+)/.exec(location.hash), d = null;
  var my = /[#&]y=([A-Za-z0-9+$-]+)/.exec(location.hash);
  if (my) {
    try { d = expand(JSON.parse(lzDecompress(my[1]))); } catch (e) { d = null; }
  } else if (mz) {
    try {
      d = JSON.parse(lzDecompress(mz[1]));
      /* Seconds in a #z= link. */
      if (d && d.at && d.at < 1e11) d.at *= 1000;
    } catch (e) { d = null; }
  } else if (m) {
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      d = JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) { d = null; }
  }
  if (!d || typeof d !== 'object') {
    $('out').innerHTML = '';
    var p = document.createElement('p');
    p.className = 'bad';
    p.textContent = 'Nothing to show. Open this page by scanning the code in AquaPlay: Settings, Help, Share my settings.';
    $('out').appendChild(p);
    return;
  }
  var rows = [
    ['AquaPlay version', d.v],
    ['TV', d.dev],
    ['Language', LANGS[d.lang] || d.lang],
    ['Playlist', d.pl || 'none'],
    ['Playlists on this TV', d.pls],
    ['Channels', d.ch],
    ['Guide', d.guide ? 'loaded' : 'not loaded'],
    ['Premium', PREMIUM[d.pm] || d.pm],
    ['Last player message', d.err || 'none'],
    ['Shared', d.at ? new Date(d.at).toLocaleString() : '']
  ];
  /* The channel playing when it was shared, and what its stream held: a
     track marked UNSUPPORTED is one this TV cannot decode (from 1.0.50). */
  if (d.chn || d.play) {
    var pl = d.play || {};
    rows.splice(rows.length - 1, 0,
      ['Channel playing', d.chn || 'none'],
      ['Stream', pl.kind ? pl.kind + ', ' + pl.eng + (pl.size ? ', ' + pl.size : '') + (pl.muted ? ', muted in AquaPlay' : '') : 'nothing playing'],
      ['Tracks', pl.tracks || 'none reported']);
  }
  /* The last stalls (from 1.0.50): how far into the channel each began, how
     long it lasted, and what the app was reading behind it. */
  if (d.stalls) {
    var mmss = function (s) { s = +s || 0; return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
    rows.splice(rows.length - 1, 0, ['Buffering', d.stalls.length ? d.stalls.map(function (x) {
      return mmss(x[0]) + ' in, ' + (x[1] || '?') + ' s' + (x[2] ? ' (reading the ' + x[2] + ')' : '');
    }).join('; ') : 'none this session']);
  }
  /* More from 1.0.50: the stream format, the account's limits, the line,
     memory, the guide's reach and the last errors. */
  var x = d.x;
  if (x && typeof x === 'object') {
    var more = [];
    if (x.ext || x.fmt) more.push(['Stream format', (x.ext ? x.ext.toUpperCase() + ' playing' : 'nothing playing') +
      (x.fmt ? '; account allows ' + x.fmt : '') + (x.ts ? '; switched to MPEG-TS after buffering' : '') +
      (x.tsAsk ? '; asked about MPEG-TS: ' + ({ yes: 'switched', no: 'kept HLS', asked: 'no answer' }[x.tsAsk] || x.tsAsk) : '')]);
    if (x.exp || x.cons) more.push(['Account', (x.exp ? 'expires ' + x.exp : 'no expiry given') + (x.cons ? ', ' + x.cons + ' connection(s) allowed' : '')]);
    if (x.vod) more.push(['Films and series', x.vod[0] + ' films, ' + x.vod[1] + ' series']);
    if (x.mbit) more.push(['Line speed', x.mbit + ' Mbit/s (last measured)']);
    /* From 1.0.50 an Android TV says its connection itself (x.link). */
    var ln = x.link;
    if (ln && ln.type) {
      more.push(['Network', ({ wifi: 'Wi-Fi', ethernet: 'Cable (Ethernet)', mobile: 'Mobile data' }[ln.type] || ln.type) +
        (ln.ghz ? ', ' + ln.ghz + ' GHz' : '') + (ln.std ? ', Wi-Fi ' + ln.std : '') +
        (ln.dbm ? ', signal ' + ln.dbm + ' dBm (' + (ln.dbm >= -60 ? 'good' : ln.dbm >= -70 ? 'fair' : 'weak') + ')' : '') +
        (ln.link ? ', link ' + ln.link + ' Mbit/s' : '')]);
    } else if (x.net) more.push(['Network', x.net]);
    if (x.gcov) more.push(['Guide covers', x.gcov[0] + ' of ' + x.gcov[1] + ' live channels now' + (x.guides ? ' (' + x.guides + ' own guide address' + (x.guides > 1 ? 'es' : '') + ')' : '')]);
    if (x.logos) more.push(['Channel logos', x.logos[0] + ' of ' + x.logos[1] + ' live channels have one']);
    if (x.free || x.heap) more.push(['Memory', (x.free ? x.free + ' MB free on the TV' : '') + (x.free && x.heap ? ', ' : '') + (x.heap ? 'app using ' + x.heap + ' MB' : '')]);
    if (x.up != null) more.push(['App open for', x.up + ' min']);
    if (x.tz != null) more.push(['Time zone', 'UTC' + (x.tz >= 0 ? '+' : '-') + Math.floor(Math.abs(x.tz) / 60) + (Math.abs(x.tz) % 60 ? ':' + ('0' + Math.abs(x.tz) % 60).slice(-2) : '')]);
    if (x.viewers > 1 || x.simkl) more.push(['Viewers', (x.viewers || 1) + (x.simkl ? ', Simkl signed in' : '')]);
    if (x.errs && x.errs.length) more.push(['Last errors', x.errs.join(' | ')]);
    Array.prototype.splice.apply(rows, [rows.length - 1, 0].concat(more));
  }
  var text = ['AquaPlay settings'];
  /* What happened (from 1.0.52): how the last sessions ended, where a start
     got to, the memory, and the other apps in memory as AquaPlay opened. */
  var hx = (d.x && typeof d.x === 'object') ? d.x : {}, happened = [];
  var ENDED = { x: 'closed normally', b: 'closed in the background', c: 'crashed', e: "didn't finish starting", t: 'closed by the TV while on screen, no Exit pressed (short of memory, or the TV switched off)' };
  var ago = function (m) { m = +m || 0; return m < 60 ? m + ' min' : m < 2880 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' days'; };
  var span = function (s) { s = +s || 0; return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
  (Array.isArray(hx.hist) ? hx.hist : []).forEach(function (h) {
    var step = typeof h[4] === 'number' ? (HELP_STEPS[h[4]] || 'step ' + h[4]) : (h[4] || '');
    happened.push(ago(h[0]) + ' before this: ' + (ENDED[h[1]] || h[1]) + ' after ' + span(h[2]) +
      ((h[1] === 'c' || h[1] === 'e' || h[1] === 't') && step ? ', its last step ' + step : '') + (h[3] ? ', lowest free memory ' + h[3] + ' MB' : ''));
  });
  if (hx.apps) happened.push('Other apps in memory as AquaPlay opened: ' + hx.apps.join(', '));
  if (hx.low) happened.push('Lowest free memory on the TV this session: ' + hx.low + ' MB');
  var bad = (Array.isArray(hx.hist) ? hx.hist : []).filter(function (h) { return h[1] === 'c' || h[1] === 'e' || h[1] === 't'; });
  /* What happened goes at the very end, closed (the owner, 2 Nov 2026: a
     viewer sees Things to check; whoever helps opens Details for support). */
  var supportDetails = null;
  if (happened.length) {
    var hd = document.createElement('details'), hs = document.createElement('summary'), hh = document.createElement('h3'), hl = document.createElement('ul');
    hd.className = 'support';
    hs.textContent = 'Details for support';
    hh.textContent = 'What happened';
    happened.forEach(function (c) { var li = document.createElement('li'); li.textContent = c; if (/crashed|didn't finish|closed by the TV/.test(c)) li.className = 'bad'; hl.appendChild(li); });
    hd.appendChild(hs); hd.appendChild(hh); hd.appendChild(hl);
    supportDetails = hd;
  }
  /* Things to check (from 1.0.50): what the report itself points at, for
     whoever is helping — read from the numbers above, a first guess. */
  var xx = (d.x && typeof d.x === 'object') ? d.x : {}, stalls = d.stalls || [], ss = d.s || {}, checks = [];
  if (stalls.length) {
    /* Stream format is an Xtream account's (#31 of the public issues: an
       M3U address was told to change it, and nothing there does). */
    if (xx.ext === 'm3u8') checks.push(d.pl === 'Xtream Codes' || xx.tsOk
      ? 'The channel stopped while playing as HLS: MPEG-TS often plays on (Settings, Stream format).'
      : 'The channel stopped while playing as HLS. Stream format works only for an Xtream login: ask the provider for MPEG-TS links (often the same address ending in .ts), or for an Xtream login, and set Stream format to MPEG-TS.');
    if (ss.bufferSize === 'small') checks.push('Buffer is set to Small: Auto or Large is steadier (Settings, Buffer).');
    if (xx.link && xx.link.type === 'wifi' && xx.link.dbm && xx.link.dbm < -70) checks.push('The Wi-Fi signal is weak (' + xx.link.dbm + ' dBm): a cable, or the router nearer the TV, would help.');
    if (xx.link && xx.link.type === 'wifi' && xx.link.ghz === 2.4) checks.push('The TV is on 2.4 GHz Wi-Fi: 5 GHz, where the router has it, is faster and steadier.');
    if (xx.mbit && xx.mbit < 10) checks.push('The line measured ' + xx.mbit + ' Mbit/s: under about 10 can be too little for HD.');
    if (stalls.length >= 2 && !checks.length) checks.push('It buffered ' + stalls.length + ' times this session; the stream and the line look fine, so the provider is the next thing to ask.');
  }
  if (d.guide && xx.gcov && !xx.gcov[0]) checks.push('The guide matched none of the live channels: another guide address may fit (Settings, Guide address).');
  if (xx.logos && xx.logos[1] && !xx.logos[0]) checks.push('No channel has a logo: the playlist names none that AquaPlay can read, and the guide has none for them.');
  if (xx.free && xx.free < 150) checks.push('The TV has little memory free (' + xx.free + ' MB): restarting the TV may help.');
  var heavy = (xx.apps || []).filter(function (a) { return /YouTube|Netflix|Prime Video|Disney\+|Max|DAZN|Twitch|Plex/.test(a); });
  if (heavy.length && (bad.length || (xx.low && xx.low < 80))) checks.push(heavy.join(' and ') + ' stayed in memory as AquaPlay opened, on a TV short of memory: restarting the TV, or opening AquaPlay first, may help.');
  if (bad.length) checks.push('AquaPlay ' + ({ e: "didn't finish starting", t: 'was closed by the TV while on screen' }[bad[0][1]] || 'crashed') + ' ' + ago(bad[0][0]) + ' before this: the crash report (Settings, Advanced, Crash report), taken right after it happens, shows more.');
  if (checks.length) {
    var hc = document.createElement('h2'), ul = document.createElement('ul');
    hc.textContent = 'Things to check';
    checks.forEach(function (c) { var li = document.createElement('li'); li.textContent = c; ul.appendChild(li); });
    $('out').appendChild(hc); $('out').appendChild(ul);
    text.push('', 'Things to check:');
    checks.forEach(function (c) { text.push('- ' + c); });
    text.push('');
  }
  var table = document.createElement('table');
  rows.forEach(function (r) {
    var tr = document.createElement('tr'), th = document.createElement('th'), td = document.createElement('td');
    th.textContent = r[0];
    td.textContent = String(r[1] == null ? '' : r[1]);
    if ((r[0] === 'Last player message' && d.err) || (r[0] === 'Tracks' && /UNSUPPORTED/.test(td.textContent))) td.className = 'bad';
    tr.appendChild(th); tr.appendChild(td); table.appendChild(tr);
    text.push(r[0] + ': ' + td.textContent);
  });
  $('out').appendChild(table);
  var keys = Object.keys(d.s || {});
  var h = document.createElement('h2');
  h.textContent = keys.length ? 'Settings changed from the defaults' : 'Every setting is as it came';
  $('out').appendChild(h);
  text.push('', h.textContent + (keys.length ? ':' : ''));
  if (keys.length) {
    var t2 = document.createElement('table');
    keys.sort().forEach(function (k) {
      var v = d.s[k], shown = typeof v === 'object' ? JSON.stringify(v) : String(v);
      var tr = document.createElement('tr'), th = document.createElement('th'), td = document.createElement('td');
      th.textContent = k; td.textContent = shown;
      tr.appendChild(th); tr.appendChild(td); t2.appendChild(tr);
      text.push(k + ': ' + shown);
    });
    $('out').appendChild(t2);
  }
  if (supportDetails) {
    $('out').appendChild(supportDetails);
    text.push('', 'Details for support, what happened:');
    happened.forEach(function (c) { text.push('- ' + c); });
  }
  var all = text.join('\n');
  $('copy').hidden = false;
  $('copy').onclick = function () {
    var done = function () { $('msg').textContent = 'Copied. Paste it where you are asking for help.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(all).then(done, function () { fallback(); });
    else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = all; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { $('msg').textContent = 'Could not copy. Take a screenshot instead.'; }
      document.body.removeChild(ta);
    }
  };
  if (navigator.share) {
    $('share').hidden = false;
    $('share').onclick = function () { navigator.share({ title: 'AquaPlay settings', text: all }).catch(function () {}); };
  }
})();
</script>
</body>
</html>
